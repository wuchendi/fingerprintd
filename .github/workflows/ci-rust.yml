name: CI (rust)

# Runs only when the Rust workspace (or its toolchain config) changes, so a
# docs- or TS-only change no longer spins up the Rust toolchain. The `push` and
# `pull_request` triggers share one path list via a YAML anchor.
on:
  push:
    branches: [main]
    paths: &rust-paths
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - ".github/workflows/ci-rust.yml"
  pull_request:
    paths: *rust-paths

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (fmt + clippy + test + build + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (nextest)
        run: cargo nextest run --all-features

      - name: Build
        run: cargo build --all-targets

      # docs.rs builds the published crate with the workspace lints, where
      # `warnings = "deny"` turns any rustdoc warning into a failed build.
      - name: Docs (published crate)
        run: cargo doc -p fingerprintd --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Supply-chain (cargo-deny)
        run: cargo deny check

  wasm:
    name: wasm (fp-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Test (fp-wasm)
        run: cargo test -p fp-wasm
