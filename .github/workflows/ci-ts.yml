name: CI (ts)

# Runs only when the TypeScript workspace (packages/apps) or its shared config
# changes. The TS suites exercise the WASM built from `crates/fp-wasm` — that
# artifact is NO LONGER committed (it is a build output), so the `wasm` job below
# rebuilds it from source and publishes it as an artifact the other jobs download
# into `apps/edge/wasm` / `packages/client/wasm` BEFORE `bun install`. Install
# must run with the WASM present because the repo-root `prepare` script builds the
# `@cdlab/fingerprintd-client` SDK, which imports the vendored glue. A Rust-source
# change now flows through here (the `wasm` job rebuilds), so there is no separate
# committed-vs-source drift guard. The `push` and `pull_request` triggers share
# one path list via a YAML anchor.
on:
  push:
    branches: [main]
    paths: &ts-paths
      - "crates/**"
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - ".github/workflows/ci-ts.yml"
  pull_request:
    paths: *ts-paths

jobs:
  # Build the vendored WASM once from source and publish it as an artifact the
  # TS jobs download. Pinned toolchain + shared TEST probe key mirror the deploy
  # workflows so the build is predictable and the probe fixtures assert against a
  # known vector (fp-wasm `matches_server_probe_vector`, client `probe.test.ts` →
  # ad83144894f917b94072c2f7b3246af66d3bc5a450562ccf3671ed64d33137d0). Both
  # consumers (edge/client) use the SAME build, so one artifact serves all.
  wasm:
    name: wasm (build vendored artifact from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install pinned wasm-pack (0.15.0)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Build vendored WASM from source
        env:
          # The shared TEST probe key the fixtures assert. Absolute --out-dir —
          # wasm-pack resolves `--out-dir` relative to the CRATE dir.
          FP_PROBE_KEY: test-probe-secret
        run: wasm-pack build --target web --out-dir "$GITHUB_WORKSPACE/wasm-dist" crates/fp-wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendored-wasm
          path: wasm-dist/
          if-no-files-found: error

  web:
    name: web (biome + typecheck + test + build)
    needs: wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v5

      # The SDK build/tests (and the root `prepare` on install) import the
      # vendored glue — place it before `bun install`.
      - name: Download vendored WASM (packages/client/wasm)
        uses: actions/download-artifact@v4
        with:
          name: vendored-wasm
          path: packages/client/wasm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bunx @biomejs/biome check .

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  web-app:
    name: "web-app (apps/web: biome + typecheck + build)"
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # apps/web consumes the built SDK, which imports the vendored glue — place
      # it before `bun install` (the root `prepare` builds the SDK on install).
      - name: Download vendored WASM (packages/client/wasm)
        uses: actions/download-artifact@v4
        with:
          name: vendored-wasm
          path: packages/client/wasm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # apps/web consumes the built SDK — build it first (dist is gitignored).
      - name: Build SDK (@cdlab/fingerprintd-client)
        run: bun run --filter @cdlab/fingerprintd-client build

      - name: Biome check
        working-directory: apps/web
        run: bunx @biomejs/biome check .

      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck

      - name: Build
        working-directory: apps/web
        run: bun run build

  edge:
    name: "edge (apps/edge: biome + typecheck + vitest + build)"
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The edge tests read `apps/edge/wasm` from disk and wrangler bundles it;
      # the root `prepare` (SDK build on install) needs `packages/client/wasm`.
      # Both are the same build — download the artifact into each.
      - name: Download vendored WASM (apps/edge/wasm)
        uses: actions/download-artifact@v4
        with:
          name: vendored-wasm
          path: apps/edge/wasm

      - name: Download vendored WASM (packages/client/wasm)
        uses: actions/download-artifact@v4
        with:
          name: vendored-wasm
          path: packages/client/wasm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # Single workspace lockfile lives at the repo root (mirror the web-app job).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        working-directory: apps/edge
        run: bunx @biomejs/biome check .

      - name: Typecheck
        working-directory: apps/edge
        run: bun run typecheck

      # identify (router + state + parity) AND checkin (assess + risk-engine +
      # store + velocity-do) via @cloudflare/vitest-pool-workers (miniflare),
      # node + workers pools; fails on any failure.
      - name: Test (vitest — node + workers pools)
        working-directory: apps/edge
        run: bun run test

      - name: Build (wrangler dry-run)
        working-directory: apps/edge
        run: bun run deploy:dry

  js-sca:
    name: "js-sca (bun audit — workspace supply-chain)"
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `bun install` runs the root `prepare` (SDK build), which imports the
      # vendored glue — place it before install even though this job only audits.
      - name: Download vendored WASM (packages/client/wasm)
        uses: actions/download-artifact@v4
        with:
          name: vendored-wasm
          path: packages/client/wasm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun audit exits non-zero on advisories >= the given level. Gate at
      # high: fails CI on high/critical vulns while tolerating a transitive
      # dev-only moderate (esbuild dev-server GHSA-67mh-4wv8-2f99) that no
      # workspace dep exposes at runtime.
      #
      # Explicit ignores — dev-only transitive deps with no reachable fix; drop
      # each once its upstream moves:
      #   GHSA-vfj7-8cjw-p6xm  braces <=3.0.3 (via shadcn → fast-glob →
      #                        micromatch): no patched release exists.
      #   GHSA-4cwx-7wf7-3272, GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3
      #                        undici 7.28.0, pinned EXACTLY by miniflare
      #                        (wrangler / vitest-pool-workers, local dev only);
      #                        clears on the next wrangler bump.
      - name: Audit dependencies
        run: >-
          bun audit --audit-level=high
          --ignore GHSA-vfj7-8cjw-p6xm
          --ignore GHSA-4cwx-7wf7-3272
          --ignore GHSA-rfgv-xxqx-mfg5
          --ignore GHSA-w293-vg96-wgc3
