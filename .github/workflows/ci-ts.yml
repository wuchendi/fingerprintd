name: CI (ts)

# Runs only when the TypeScript workspace (packages/apps) or its shared config
# changes. The edge Worker bundles the WASM built from `crates/fp-wasm`, a build
# output that is not committed: the `wasm` job rebuilds it from source and
# publishes it as an artifact the edge job downloads into `apps/edge/wasm`
# BEFORE `bun install`. A Rust-source change flows through here (the `wasm` job
# rebuilds), so there is no separate committed-vs-source drift guard. The SDK
# (packages/client) is pure TypeScript and needs no WASM. The `push` and
# `pull_request` triggers share one path list via a YAML anchor.
on:
  push:
    branches: [main]
    paths: &ts-paths
      - "crates/**"
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - ".github/workflows/ci-ts.yml"
  pull_request:
    paths: *ts-paths

jobs:
  # Build the edge Worker's WASM once from source and publish it as an artifact
  # the edge job downloads. The pinned toolchain mirrors the deploy workflows so
  # the build is predictable.
  wasm:
    name: wasm (build vendored artifact from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install pinned wasm-pack (0.15.0)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      # Absolute --out-dir — wasm-pack resolves `--out-dir` relative to the
      # CRATE dir.
      - name: Build vendored WASM from source
        run: wasm-pack build --target web --out-dir "$GITHUB_WORKSPACE/wasm-dist" crates/fp-wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendored-wasm
          path: wasm-dist/
          if-no-files-found: error

  web:
    name: web (biome + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bunx @biomejs/biome check .

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  web-app:
    name: "web-app (apps/web: biome + typecheck + build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # apps/web consumes the built SDK — build it first (dist is gitignored).
      - name: Build SDK (@cdlab/fingerprintd)
        run: bun run --filter @cdlab/fingerprintd build

      - name: Biome check
        working-directory: apps/web
        run: bunx @biomejs/biome check .

      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck

      - name: Build
        working-directory: apps/web
        run: bun run build

  edge:
    name: "edge (apps/edge: biome + typecheck + vitest + build)"
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The edge tests read `apps/edge/wasm` from disk and wrangler bundles it —
      # place it before `bun install` so the root `prepare` skips rebuilding it.
      - name: Download vendored WASM (apps/edge/wasm)
        uses: actions/download-artifact@v4
        with:
          name: vendored-wasm
          path: apps/edge/wasm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # Single workspace lockfile lives at the repo root (mirror the web-app job).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        working-directory: apps/edge
        run: bunx @biomejs/biome check .

      - name: Typecheck
        working-directory: apps/edge
        run: bun run typecheck

      # identify (router + state + parity) AND checkin (assess + risk-engine +
      # store + velocity-do) via @cloudflare/vitest-pool-workers (miniflare),
      # node + workers pools; fails on any failure.
      - name: Test (vitest — node + workers pools)
        working-directory: apps/edge
        run: bun run test

      - name: Build (wrangler dry-run)
        working-directory: apps/edge
        run: bun run deploy:dry

  js-sca:
    name: "js-sca (bun audit — workspace supply-chain)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun audit exits non-zero on advisories >= the given level. Gate at
      # high: fails CI on high/critical vulns while tolerating a transitive
      # dev-only moderate (esbuild dev-server GHSA-67mh-4wv8-2f99) that no
      # workspace dep exposes at runtime.
      #
      # Explicit ignores — dev-only transitive deps with no reachable fix; drop
      # each once its upstream moves:
      #   GHSA-vfj7-8cjw-p6xm  braces <=3.0.3 (via shadcn → fast-glob →
      #                        micromatch): no patched release exists.
      #   GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3
      #                        undici 7.29.0 (<7.29.1), pinned EXACTLY by the
      #                        miniflare that @cloudflare/vitest-pool-workers
      #                        carries (test runner only); clears on the next
      #                        vitest-pool-workers bump.
      - name: Audit dependencies
        run: >-
          bun audit --audit-level=high
          --ignore GHSA-vfj7-8cjw-p6xm
          --ignore GHSA-rfgv-xxqx-mfg5
          --ignore GHSA-w293-vg96-wgc3
