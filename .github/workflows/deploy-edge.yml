name: Deploy edge (Cloudflare)

# Manual trigger only — deploying is explicit; CI (ci.yml) never auto-deploys.
# Run from the Actions tab, optionally applying the remote D1 migrations first.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   deploy auth for wrangler (Workers Scripts:Edit,
#                          D1:Edit, and Account Settings:Read on the account)
#   CLOUDFLARE_ACCOUNT_ID  deploy target account id
#
# Optional Worker runtime secrets (synced AFTER deploy; unset ones are skipped,
# so leaving them blank keeps the Worker's current value):
#   FP_SALT_SECRET   stable, high-entropy salt seed — set this for a real deploy
#                    (else blocking keys use a dev placeholder, not deployment-bound)
#   FP_PROBE_KEY     enables the nonce probe (T8) and is baked into the vendored
#                    WASM this workflow rebuilds from source before deploy, so the
#                    deployed Worker artifact is reproducible rather than the
#                    committed dev build. NOTE: the Worker verifies probes with the
#                    RUNTIME key (FpEngine), so this compile-time bake buys supply-
#                    chain reproducibility, not probe behavior — browser-client
#                    parity still needs packages/client/wasm rebuilt with the SAME key
#                    when that front-end deploy lands.
#   FP_SIGNING_KEY   enables response signing (T9).

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Apply the remote D1 migrations before deploying'
        type: boolean
        default: false

concurrency:
  group: deploy-edge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Consumed by wrangler for every remote call (migrate / deploy / secret).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      # Kept in sync with ci.yml's Bun setup.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # Build the vendored WASM from source so the deployed Worker ships a
      # reproducible artifact (the WASM is a build output, not committed).
      # FP_PROBE_KEY is baked in at compile time (crates/fp-wasm `option_env!`);
      # unset ⇒ the dev placeholder. This is supply-chain reproducibility only:
      # /identify still verifies probes with the RUNTIME key, and browser-client
      # parity is a packages/client concern (rebuilt in deploy-web.yml).
      #
      # MUST run before `bun install`: the repo-root `prepare` script builds the
      # `@cdlab/fingerprintd` SDK on install, which imports the vendored
      # glue under `packages/client/wasm` — so we materialise both dirs first.
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build vendored WASM (crates/fp-wasm -> apps/edge/wasm + packages/client/wasm)
        env:
          FP_PROBE_KEY: ${{ secrets.FP_PROBE_KEY }}
        # `--out-dir` is resolved relative to the CRATE dir — pass an ABSOLUTE
        # path, else it lands in `crates/fp-wasm/apps/edge/wasm`. The client copy
        # only exists so the root `prepare` SDK build succeeds during install; the
        # deployed Worker consumes `apps/edge/wasm`.
        run: |
          wasm-pack build --target web --out-dir "$GITHUB_WORKSPACE/apps/edge/wasm" crates/fp-wasm
          mkdir -p "$GITHUB_WORKSPACE/packages/client/wasm"
          cp -R "$GITHUB_WORKSPACE/apps/edge/wasm/." "$GITHUB_WORKSPACE/packages/client/wasm/"

      # Bun workspace install from the repo root (one lockfile for both packages).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Optional: apply the drizzle-kit migrations in apps/edge/src/database to
      # the remote D1 bound in wrangler.jsonc before the code goes live.
      - name: Apply D1 migrations (remote)
        if: ${{ inputs.run_migrations }}
        working-directory: apps/edge
        run: bun run cf:remotedb

      - name: Deploy
        working-directory: apps/edge
        run: bun run deploy

      # Sync Worker runtime secrets from GitHub secrets (idempotent). Runs AFTER
      # deploy so the Worker exists; empty GitHub secrets are skipped so an unset
      # value never wipes an existing Worker secret.
      - name: Sync Worker secrets
        working-directory: apps/edge
        env:
          FP_SALT_SECRET: ${{ secrets.FP_SALT_SECRET }}
          FP_PROBE_KEY: ${{ secrets.FP_PROBE_KEY }}
          FP_SIGNING_KEY: ${{ secrets.FP_SIGNING_KEY }}
        run: |
          jq -n '
            [
              {key: "FP_SALT_SECRET",  value: env.FP_SALT_SECRET},
              {key: "FP_PROBE_KEY",    value: env.FP_PROBE_KEY},
              {key: "FP_SIGNING_KEY",  value: env.FP_SIGNING_KEY}
            ]
            | map(select(.value != null and .value != ""))
            | from_entries
          ' > "$RUNNER_TEMP/edge-secrets.json"
          if [ "$(jq 'length' "$RUNNER_TEMP/edge-secrets.json")" -eq 0 ]; then
            echo "No Worker secrets provided — skipping sync"
          else
            jq 'keys' "$RUNNER_TEMP/edge-secrets.json"
            bunx wrangler secret bulk "$RUNNER_TEMP/edge-secrets.json"
          fi
          rm -f "$RUNNER_TEMP/edge-secrets.json"
