name: Deploy edge (Cloudflare)

# Manual trigger only — deploying is explicit; CI (ci.yml) never auto-deploys.
# Run from the Actions tab; database migrations are applied first by default.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   deploy auth for wrangler (Workers Scripts:Edit,
#                          D1:Edit, and Account Settings:Read on the account)
#   CLOUDFLARE_ACCOUNT_ID  deploy target account id
#
# Worker runtime secrets (synced BEFORE deploy so the new code never starts
# without its config; empty ones are skipped, so an unset GitHub secret never
# wipes an existing Worker secret):
#   FP_SALT_SECRET     stable, high-entropy salt seed — required; the Worker
#                      refuses to start without it
#   FP_ADMIN_KEY       enables DELETE /visitor/{id}
#   FP_API_KEY         server-to-server API key for the server-side API
#   LIBSQL_URL         libSQL/Turso database URL (DB_TYPE=libsql, the default in
#                      wrangler.jsonc; also selects the libSQL migrations)
#   LIBSQL_AUTH_TOKEN  libSQL/Turso auth token

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Apply database migrations before deploying (libSQL when the LIBSQL_URL secret is set, else D1)'
        type: boolean
        default: true

concurrency:
  group: deploy-edge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Consumed by wrangler for every remote call (migrate / deploy / secret).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      # Kept in sync with ci.yml's Bun setup.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # Build the vendored WASM from source so the deployed Worker ships a
      # reproducible artifact (the WASM is a build output, not committed).
      #
      # MUST run before `bun install`: the repo-root `prepare` script builds the
      # `@cdlab/fingerprintd` SDK on install, which imports the vendored
      # glue under `packages/client/wasm` — so we materialise both dirs first.
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build vendored WASM (crates/fp-wasm -> apps/edge/wasm + packages/client/wasm)
        # `--out-dir` is resolved relative to the CRATE dir — pass an ABSOLUTE
        # path, else it lands in `crates/fp-wasm/apps/edge/wasm`. The client copy
        # only exists so the root `prepare` SDK build succeeds during install; the
        # deployed Worker consumes `apps/edge/wasm`.
        run: |
          wasm-pack build --target web --out-dir "$GITHUB_WORKSPACE/apps/edge/wasm" crates/fp-wasm
          mkdir -p "$GITHUB_WORKSPACE/packages/client/wasm"
          cp -R "$GITHUB_WORKSPACE/apps/edge/wasm/." "$GITHUB_WORKSPACE/packages/client/wasm/"

      # Bun workspace install from the repo root (one lockfile for both packages).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply database migrations
        if: ${{ inputs.run_migrations }}
        working-directory: apps/edge
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: |
          if [ -n "$LIBSQL_URL" ]; then
            DB_TYPE=libsql bun run db:migrate
          else
            bun run cf:remotedb
          fi

      # Sync Worker runtime secrets from GitHub secrets (idempotent). Runs BEFORE
      # deploy so the new code never starts without its config; empty GitHub
      # secrets are skipped so an unset value never wipes an existing Worker secret.
      - name: Sync Worker secrets
        working-directory: apps/edge
        env:
          FP_SALT_SECRET: ${{ secrets.FP_SALT_SECRET }}
          FP_ADMIN_KEY: ${{ secrets.FP_ADMIN_KEY }}
          FP_API_KEY: ${{ secrets.FP_API_KEY }}
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: |
          jq -n '
            [
              {key: "FP_SALT_SECRET",    value: env.FP_SALT_SECRET},
              {key: "FP_ADMIN_KEY",      value: env.FP_ADMIN_KEY},
              {key: "FP_API_KEY",        value: env.FP_API_KEY},
              {key: "LIBSQL_URL",        value: env.LIBSQL_URL},
              {key: "LIBSQL_AUTH_TOKEN", value: env.LIBSQL_AUTH_TOKEN}
            ]
            | map(select(.value != null and .value != ""))
            | from_entries
          ' > "$RUNNER_TEMP/edge-secrets.json"
          if [ "$(jq 'length' "$RUNNER_TEMP/edge-secrets.json")" -eq 0 ]; then
            echo "No Worker secrets provided — skipping sync"
          else
            jq 'keys' "$RUNNER_TEMP/edge-secrets.json"
            bunx wrangler secret bulk "$RUNNER_TEMP/edge-secrets.json"
          fi
          rm -f "$RUNNER_TEMP/edge-secrets.json"

      - name: Deploy
        working-directory: apps/edge
        run: bun run deploy
