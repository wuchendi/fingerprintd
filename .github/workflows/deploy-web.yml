name: Deploy web (Cloudflare)

# Manual trigger only — deploying is explicit; CI (ci.yml) never auto-deploys.
# Publishes the apps/web SPA to Cloudflare Pages (direct upload) as the
# `fingerprintd` project, on the same account as the edge Worker.
#
# Required repository secrets (Settings → Secrets and variables → Actions),
# shared with deploy-edge.yml:
#   CLOUDFLARE_API_TOKEN   deploy auth for wrangler (needs Cloudflare Pages:Edit;
#                          the edge Worker token's Workers Scripts:Edit is not
#                          sufficient for Pages — grant Pages:Edit on the token)
#   CLOUDFLARE_ACCOUNT_ID  deploy target account id

on:
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Consumed by wrangler for every remote call.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      # Kept in sync with ci.yml's Bun setup.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # Bun workspace install from the repo root (one lockfile for all packages).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The SPA consumes the built SDK — its dist/ is gitignored, so build it
      # before the app so `@cdlab/fingerprintd` resolves.
      - name: Build SDK (@cdlab/fingerprintd)
        run: bun run --filter @cdlab/fingerprintd build

      - name: Build web
        working-directory: apps/web
        run: bun run build

      - name: Deploy
        working-directory: apps/web
        run: bun run deploy
