name: Deploy web (Cloudflare)

# Manual trigger only — deploying is explicit; CI (ci.yml) never auto-deploys.
# Publishes the apps/web SPA to Cloudflare Pages (direct upload) as the
# `fingerprintd` project, on the same account as the edge Worker.
#
# Required repository secrets (Settings → Secrets and variables → Actions),
# shared with deploy-edge.yml:
#   CLOUDFLARE_API_TOKEN   deploy auth for wrangler (needs Cloudflare Pages:Edit;
#                          the edge Worker token's Workers Scripts:Edit is not
#                          sufficient for Pages — grant Pages:Edit on the token)
#   CLOUDFLARE_ACCOUNT_ID  deploy target account id
# Optional (must equal the edge Worker's runtime key for the browser probe to
# verify against `fingerprintd-edge`, else /identify returns 401 under probe
# enforcement — same secret deploy-edge.yml bakes into the edge WASM):
#   FP_PROBE_KEY           browser nonce-probe key (T8), baked into the SDK WASM

on:
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Consumed by wrangler for every remote call.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      # Kept in sync with ci.yml's Bun setup.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # Build the SDK's vendored WASM from source with the deployment's probe key,
      # so the browser computes the SAME T8 probe the edge Worker verifies. The
      # WASM is a build output (not committed); without this the deployed
      # playground could 401 under probe enforcement. Mirrors deploy-edge.yml's
      # rebuild. FP_PROBE_KEY unset ⇒ the dev default.
      #
      # MUST run before `bun install`: the repo-root `prepare` script builds the
      # `@cdlab/fingerprintd` SDK on install, which imports this vendored
      # glue under `packages/client/wasm`.
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build SDK WASM (crates/fp-wasm -> packages/client/wasm)
        env:
          FP_PROBE_KEY: ${{ secrets.FP_PROBE_KEY }}
        # `--out-dir` is resolved relative to the CRATE dir, so pass an ABSOLUTE
        # path — a repo-relative `packages/client/wasm` would silently land in
        # `crates/fp-wasm/packages/client/wasm` and the real vendor dir (which the
        # SPA bundles) would keep the wrong WASM.
        run: wasm-pack build --target web --out-dir "$GITHUB_WORKSPACE/packages/client/wasm" crates/fp-wasm

      # Bun workspace install from the repo root (one lockfile for all packages).
      # The root `prepare` builds the SDK here, bundling the freshly-keyed WASM.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The SPA consumes the built SDK — its dist/ is gitignored, so build it
      # (bundling the freshly-keyed WASM) before the app so `@cdlab/fingerprintd`
      # resolves.
      - name: Build SDK (@cdlab/fingerprintd)
        run: bun run --filter @cdlab/fingerprintd build

      - name: Build web
        working-directory: apps/web
        run: bun run build

      - name: Deploy
        working-directory: apps/web
        run: bun run deploy
