name: Release (npm + crates.io)

# Publishes the browser SDK (`@cdlab/fingerprintd`, packages/client) to npm and
# the Rust crates (`fingerprintd-core`, `fingerprintd`) to crates.io.
# `fp-wasm` is deliberately NOT published: it is a wasm-pack artifact with a
# build-time probe key, consumed as a vendored module, not as a Rust dependency.
#
# Trigger: push a tag `vX.Y.Z` whose version equals BOTH manifests
# (packages/client/package.json and the Cargo workspace version), or run it
# manually. The guard job refuses a mismatched tag before anything is published.
#
# Credentials (Settings → Secrets and variables → Actions):
#   NPM_TOKEN              npm granular access token (publish, @cdlab scope)
#   CARGO_REGISTRY_TOKEN   crates.io API token (publish-new + publish-update)
# Both registries require the FIRST release of a new package/crate to be
# published with a token. After that first release you may switch to OIDC
# trusted publishing: configure this workflow file as the trusted publisher on
# npmjs.com (package settings) and crates.io (crate settings), then delete the
# secrets — each publish step falls back to OIDC when its token is absent.
#
# The npm artifact ships the DEV-keyed probe WASM (scripts/build-wasm.sh); a
# deployment that enforces the probe rebuilds the WASM with its own key and
# passes it to `initProbe()` — see packages/client/README.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm provenance + OIDC trusted publishing (npm and crates.io)

jobs:
  verify:
    name: tag matches manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare tag with package.json and Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_v="$(jq -r .version packages/client/package.json)"
          cargo_v="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag npm=$npm_v cargo=$cargo_v"
          [ "$tag" = "$npm_v" ] && [ "$tag" = "$cargo_v" ] \
            || { echo "::error::tag v$tag does not match package.json ($npm_v) / Cargo.toml ($cargo_v)"; exit 1; }

  npm:
    name: npm (@cdlab/fingerprintd)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # npm >= 11.5 (Node 24) is required for OIDC trusted publishing / provenance.
      - name: Install Node (npm CLI)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # Dev-keyed build (same as CI) — MUST run before `bun install`, whose root
      # `prepare` builds the SDK from the vendored glue.
      - name: Build SDK WASM
        run: bash scripts/build-wasm.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test + build SDK
        working-directory: packages/client
        run: |
          bun run typecheck
          bun run test
          bun run build

      - name: Publish to npm
        working-directory: packages/client
        # Secret scoped to this step only. Token present → classic token
        # publish; absent → npm's OIDC flow (requires the trusted publisher to be
        # configured for this workflow).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

  crates:
    name: crates.io (fingerprintd-core, fingerprintd)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Boolean only — the token itself is scoped to the publish step.
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Authenticate with crates.io (OIDC trusted publishing)
        if: env.HAS_CARGO_TOKEN == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # `--workspace` orders inter-dependent crates (core first) and waits for
      # the index between them (cargo >= 1.90).
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: cargo publish --workspace --exclude fp-wasm --locked
