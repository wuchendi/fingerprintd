name: Release (npm + crates.io)

# Publishes the pure-TypeScript browser SDK (`@cdlab/fingerprintd`,
# packages/client) to npm and the Rust compute crate (`fingerprintd`,
# crates/fp-core) to crates.io.
# Not published: `fingerprintd-server` (a deployable, not a library) and
# `fp-wasm` (a wasm-pack artifact vendored into the edge Worker, not a Rust
# dependency).
#
# Trigger: push a tag `vX.Y.Z` whose version equals BOTH manifests
# (packages/client/package.json and the Cargo workspace version), or run it
# manually. The guard job refuses a mismatched tag before anything is published.
#
# Credentials (Settings → Secrets and variables → Actions):
#   NPM_TOKEN              npm granular access token (publish, @cdlab scope)
#   CARGO_REGISTRY_TOKEN   crates.io API token (publish-new + publish-update)
# Both registries require the FIRST release of a new package/crate to be
# published with a token. After that first release you may switch to OIDC
# trusted publishing: configure this workflow file as the trusted publisher on
# npmjs.com (package settings) and crates.io (crate settings), then delete the
# secrets — each publish step falls back to OIDC when its token is absent.
#
# Once both registries accept the version, a GitHub Release is created for the
# tag with auto-generated notes (job `github-release`, contents: write).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm provenance + OIDC trusted publishing (npm and crates.io)

jobs:
  verify:
    name: tag matches manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare tag with package.json and Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_v="$(jq -r .version packages/client/package.json)"
          cargo_v="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag npm=$npm_v cargo=$cargo_v"
          [ "$tag" = "$npm_v" ] && [ "$tag" = "$cargo_v" ] \
            || { echo "::error::tag v$tag does not match package.json ($npm_v) / Cargo.toml ($cargo_v)"; exit 1; }

  npm:
    name: npm (@cdlab/fingerprintd)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # npm >= 11.5 (Node 24) is required for OIDC trusted publishing / provenance.
      # No `registry-url` here: setup-node would then always write an
      # `_authToken` (a placeholder when NODE_AUTH_TOKEN is unset), which breaks
      # the OIDC path. Auth is configured in the publish step instead.
      - name: Install Node (npm CLI)
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test + build SDK
        working-directory: packages/client
        run: |
          bun run typecheck
          bun run test
          bun run build

      - name: Publish to npm
        working-directory: packages/client
        # Secret scoped to this step only. Token present → classic token publish
        # (the token must be allowed to bypass 2FA, or the account's 2FA policy
        # must not require an OTP for automation); absent → npm's OIDC flow
        # (requires the trusted publisher to be configured for this workflow).
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > "$HOME/.npmrc"
          fi
          name="$(jq -r .name package.json)"; ver="$(jq -r .version package.json)"
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "$name@$ver is already on npm — skipping"
          else
            npm publish
          fi

  crates:
    name: crates.io (fingerprintd)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Boolean only — the token itself is scoped to the publish step.
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Authenticate with crates.io (OIDC trusted publishing)
        if: env.HAS_CARGO_TOKEN == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          ver="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          if curl -sf -A "fingerprintd-release" "https://crates.io/api/v1/crates/fingerprintd/$ver" >/dev/null; then
            echo "fingerprintd@$ver is already on crates.io — skipping"
          else
            cargo publish -p fingerprintd --locked
          fi

  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [npm, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
