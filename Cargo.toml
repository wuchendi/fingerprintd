[workspace]
resolver = "3"
members  = ["crates/fp-core", "crates/fingerprintd", "crates/fp-wasm"]

[workspace.package]
version      = "0.0.2"
edition      = "2024"
rust-version = "1.96.0"
authors      = ["cdlab"]
license      = "Apache-2.0"
repository   = "https://github.com/WuChenDi/fingerprintd"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum  = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figment = { version = "0.10", features = ["env", "toml"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
rand = "0.10"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"

# dev-only
tower = { version = "0.5", features = ["util"] }

# === Deny-warnings policy lives in the manifest (inherited by every member) ===
[workspace.lints.rust]
warnings                      = { level = "deny", priority = -2 }
unsafe_code                   = "forbid"
missing_debug_implementations = "warn"
missing_docs                  = "warn"
unreachable_pub               = "warn"
elided_lifetimes_in_paths     = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# No panic in runtime paths.
unwrap_used = "deny"
expect_used = "deny"
panic       = "deny"
dbg_macro   = "deny"
todo        = "warn"
# Pedantic lints with poor signal-to-noise for a service binary.
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"

[profile.release]
lto           = "fat"
codegen-units = 1
debug         = "line-tables-only"
