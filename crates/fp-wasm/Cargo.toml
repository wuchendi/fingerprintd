[package]
name        = "fp-wasm"
description = "WebAssembly build of the fingerprintd compute core (blocking keys, Fellegi-Sunter scoring, passive and client-integrity signals) for the edge Worker."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
keywords    = ["fingerprinting", "wasm", "anti-fraud", "device-id"]
categories  = ["wasm", "algorithms"]
publish     = false

[lib]
# `cdylib` produces the wasm module for `wasm-pack`; `rlib` keeps the crate
# host-buildable so the native `#[cfg(test)]` parity test runs without a browser.
crate-type = ["cdylib", "rlib"]

# `wasm-pack` runs `wasm-opt` on the release build with these flags. `-Oz`
# optimizes aggressively for SIZE — behaviour-preserving, so the FUNCTIONAL drift
# guard (edge parity) stays the source of truth. Output is not byte-reproducible
# across hosts, which is exactly why the guard is functional rather than a byte
# diff.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[dependencies]
wasm-bindgen = "0.2"
# The framework-free core, without its `rng` feature: the edge host uses only
# the deterministic, seed-derived compute, so `rand`/`getrandom` (unsupported on
# `wasm32-unknown-unknown`) stays out of the wasm build graph.
fingerprintd = { path = "../fp-core", version = "0.0.2", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }

# Inherit the workspace lint policy (deny-warnings, clippy pedantic),
# but relax `unsafe_code` from `forbid` to `deny`: the `#[wasm_bindgen]` export
# glue expands to `unsafe` FFI shims we do not write by hand. `deny` still bans
# unsafe in our own source while permitting the generated boundary code.
[lints.rust]
warnings                      = { level = "deny", priority = -2 }
unsafe_code                   = "deny"
missing_debug_implementations = "warn"
missing_docs                  = "warn"
unreachable_pub               = "warn"
elided_lifetimes_in_paths     = "warn"

[lints.clippy]
pedantic    = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic       = "deny"
dbg_macro   = "deny"
todo        = "warn"
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
