[package]
name        = "fingerprintd-server"
description = "Server-authoritative device-fingerprinting service (anti-fraud / anti-automation): one-time challenge, server-side fuzzy matching, and passive-signal fusion."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
keywords    = ["fingerprinting", "anti-fraud", "bot-detection", "device-id", "security"]
categories  = ["web-programming::http-server", "authentication"]
publish     = false

[lints]
workspace = true

[[bin]]
name = "fingerprintd"
path = "src/main.rs"

[lib]
name = "fingerprintd_server"
path = "src/lib.rs"

[dependencies]
fingerprintd = { path = "../fp-core", version = "0.1.0" }
# `time` (additive over the workspace features) powers the retention sweep's
# `tokio::time::interval`; the rest come from the workspace dep.
tokio = { workspace = true, features = ["time"] }
axum  = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
figment = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
tower = { workspace = true, features = ["limit"] }
tower-http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tower = { workspace = true, features = ["util"] }
figment = { workspace = true, features = ["test"] }
